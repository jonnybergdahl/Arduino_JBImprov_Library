; Development configuration for the library itself.
;
;   pio test -e native              Run the unit tests on the host.
;   scripts/build_examples.sh       Compile every example for the boards below.

[platformio]
default_envs = native

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<JBImprovProtocol.cpp> +<JBImprov.cpp>
build_flags = -std=gnu++17 -Wall -Wextra

; Arduino ESP32 core 3.x
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
build_flags = -Wall -Wextra
; Wi-Fi and BLE together don't fit the default 1.25 MB app partition.
board_build.partitions = huge_app.csv

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -Wall -Wextra
board_build.partitions = huge_app.csv

; No Bluetooth: serial only.
[env:esp32-s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino
build_flags = -Wall -Wextra

; Arduino ESP32 core 2.x
[env:esp32dev-core2]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
build_flags = -Wall -Wextra
board_build.partitions = huge_app.csv

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
build_flags = -Wall -Wextra
